name: Verify API before merge

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Tests use Testcontainers, which uses the runner's Docker
      - run: ./mvnw -B verify
        working-directory: api
